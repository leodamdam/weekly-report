<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주간보고 음성입력</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; font-family: -apple-system, 'Malgun Gothic', sans-serif; background: #f5f6f8; color: #222; font-size: 16px; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  .row { display: flex; gap: 8px; margin-bottom: 12px; }
  select, textarea, button { font: inherit; }
  select { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 8px; background: #fff; }
  #mic { width: 100%; padding: 22px; border: 0; border-radius: 14px; background: #1a73e8; color: #fff; font-size: 20px; font-weight: bold; }
  #mic.on { background: #d93025; animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .7; } }
  #transcript { width: 100%; min-height: 120px; margin: 12px 0 8px; padding: 10px; border: 1px solid #ccc; border-radius: 8px; }
  .hint { font-size: 13px; color: #666; margin: 0 0 12px; }
  .btn { width: 100%; padding: 14px; border: 0; border-radius: 10px; font-weight: bold; font-size: 17px; }
  #parseBtn { background: #e8f0fe; color: #1a73e8; }
  .btn:disabled { opacity: .5; }
  #header { font-weight: bold; margin: 18px 0 8px; }
  .day { background: #fff; border-radius: 10px; padding: 10px; margin-bottom: 8px; }
  .day b { display: block; margin-bottom: 6px; }
  .day.changed { outline: 2px solid #1a73e8; }
  .day textarea { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 6px; min-height: 44px; font-size: 15px; }
  #status { margin: 12px 0; font-size: 14px; color: #1a73e8; min-height: 20px; }
  #status.err { color: #d93025; }
</style>
</head>
<body>
  <h1>차주 예상 주요일정 음성입력</h1>
  <div class="row">
    <select id="branch"></select>
    <select id="tab"></select>
  </div>

  <button id="mic">🎤 눌러서 말하기</button>
  <textarea id="transcript" placeholder="예) 월요일 김해 백운암에서 신규 사찰광고 촬영, 그리고 사무실에서 본사 줌회의. 수요일은 통도사 문화행사 취재."></textarea>
  <p class="hint">요일을 먼저 말하고 일정을 이어서 말하세요. 다 말하고 버튼을 다시 누르면 바로 시트에 저장됩니다.<br>여러 사람이 각자 휴대폰으로 써도 서로 지워지지 않고 아래에 이어서 들어갑니다. 고칠 내용은 시트에서 직접 고쳐 주세요.</p>
  <button id="parseBtn" class="btn">정리해서 시트에 저장 ↓</button>

  <div id="status"></div>
  <div id="header"></div>
  <div id="days"></div>

<script>
  const DAYS = ['월', '화', '수', '목', '금', '토', '일'];
  const $ = id => document.getElementById(id);
  let info = null;

  function status(msg, isErr) {
    $('status').textContent = msg;
    $('status').className = isErr ? 'err' : '';
  }
  // 시트 읽기·쓰기는 Apps Script 웹앱(doPost)이 처리
  const API = 'https://script.google.com/macros/s/AKfycbwrfaeKiEnfuwSc11gns20G2d4Ln8MPS6wQsX8jJDMb5HUb-1fQaCF6D5hndu9T5LN3Qw/exec';
  async function call(fn, ...args) {
    const res = await fetch(API, { method: 'POST', body: JSON.stringify({ fn: fn, args: args }) });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error);
    return data.result;
  }
  function store(k, v) { try { v === undefined ? (v = localStorage.getItem(k)) : localStorage.setItem(k, v); } catch (e) {} return v; }

  // 요일 칸 그리기
  DAYS.forEach(day => {
    const box = document.createElement('div');
    box.className = 'day';
    box.id = 'd-' + day;
    box.innerHTML = '<b></b><textarea class="t" placeholder="방문 사찰" readonly></textarea><textarea class="r" placeholder="사유" readonly></textarea>';
    box.querySelector('b').textContent = day + '요일';
    $('days').appendChild(box);
  });
  function setDay(day, temple, reason, changed) {
    const box = $('d-' + day);
    box.querySelector('.t').value = temple;
    box.querySelector('.r').value = reason;
    box.classList.toggle('changed', !!changed);
  }

  async function load() {
    status('시트 불러오는 중…');
    try {
      const data = await call('getNextWeek', $('tab').value, $('branch').value);
      $('header').textContent = data.header;
      data.days.forEach(d => setDay(d.day, d.temple, d.reason, false));
      status('');
    } catch (e) { status(e.message, true); }
  }

  call('getInit').then(init => {
    info = init;
    init.branches.forEach(b => $('branch').add(new Option(b, b)));
    init.tabs.forEach(t => $('tab').add(new Option(t, t)));
    const saved = store('branch');
    if (saved && init.branches.indexOf(saved) >= 0) $('branch').value = saved;
    $('tab').value = init.defaultTab;
    load();
  }).catch(e => status(e.message, true));

  $('branch').onchange = () => { store('branch', $('branch').value); load(); };
  $('tab').onchange = load;

  // 음성 인식 (브라우저 내장)
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, recording = false, autoSave = false, base = '';
  // 구글 웹앱 화면은 휴대폰에서 마이크 권한이 막히는 경우가 많음 → 키보드 받아쓰기로 전환하고 기억
  let keyboardMode = !SR || store('keyboardMode') === '1';
  function useKeyboardMode() {
    keyboardMode = true;
    store('keyboardMode', '1');
    $('mic').classList.remove('on');
    $('mic').textContent = '🎤 누른 뒤 키보드의 마이크로 말하기';
    $('transcript').placeholder = '키보드 위쪽(또는 아래쪽)의 🎤 마이크 버튼을 누르고 말하세요.\n예) 월요일 김해 백운암에서 신규 사찰광고 촬영. 수요일은 통도사 문화행사 취재.';
  }
  if (keyboardMode) useKeyboardMode();
  $('mic').onclick = () => {
    if (keyboardMode) { $('transcript').focus(); return; }
    if (recording) { recording = false; autoSave = true; rec.stop(); return; }  // 멈추면 바로 정리·저장
    rec = new SR();
    rec.lang = 'ko-KR';
    rec.continuous = true;
    rec.interimResults = true;
    base = $('transcript').value.trim();
    rec.onresult = ev => {
      let finalText = '', interim = '';
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        if (ev.results[i].isFinal) finalText += ev.results[i][0].transcript;
        else interim += ev.results[i][0].transcript;
      }
      if (finalText) base = (base + ' ' + finalText).trim();
      $('transcript').value = (base + ' ' + interim).trim();
    };
    rec.onerror = ev => {
      if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') {
        recording = false;
        useKeyboardMode();
        status('이 화면에서는 마이크 버튼을 쓸 수 없어 키보드 받아쓰기로 바꿨습니다. 파란 버튼을 다시 누르고, 키보드의 🎤로 말해 주세요.', true);
      }
    };
    // 휴대폰은 말이 잠깐 끊기면 인식이 멈추므로, 버튼을 다시 누를 때까지 이어서 듣기
    rec.onend = () => {
      if (recording) { try { rec.start(); return; } catch (e) {} }
      recording = false;
      if (keyboardMode) return;
      $('mic').classList.remove('on');
      $('mic').textContent = '🎤 눌러서 말하기';
      if (autoSave) { autoSave = false; $('parseBtn').click(); }
    };
    rec.start();
    recording = true;
    $('mic').classList.add('on');
    $('mic').textContent = '■ 듣는 중… 다 말하면 누르세요 (바로 저장)';
  };

  $('parseBtn').onclick = async () => {
    const text = $('transcript').value.trim();
    if (!text) { status('먼저 일정을 말해 주세요.', true); return; }
    if (recording) { recording = false; rec.stop(); }
    $('parseBtn').disabled = true;
    status(info && info.hasApiKey ? 'AI가 정리하는 중…' : '정리하는 중…');
    try {
      const res = await call('parse', text, $('header').textContent);
      if (!res.days.length) { status('요일을 찾지 못했습니다. "월요일 …"처럼 요일을 넣어 말해 주세요.', true); return; }
      // 말한 요일에만 이어 쓰기 → 다른 직원이 먼저 쓴 내용까지 포함된 최신 시트 내용을 다시 보여줌
      status('시트에 저장하는 중…');
      const data = await call('add', $('tab').value, $('branch').value, res.days);
      const spoken = res.days.map(d => d.day);
      data.days.forEach(d => setDay(d.day, d.temple, d.reason, spoken.indexOf(d.day) >= 0));
      $('transcript').value = '';
      status((res.warning ? res.warning + ' ' : '') + '✅ 시트에 저장했습니다. 파란 테두리 요일에 추가됐습니다.', !!res.warning);
    } catch (e) { status(e.message, true); }
    finally { $('parseBtn').disabled = false; }
  };
</script>
</body>
</html>
